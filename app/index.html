<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foot Jar</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--blue:#0041D7;--blueD:#0031A6;--ink2:#061A52;--tint:#EEF3FF;--or:#FD6B0E;
 --orD:#E45A00;--orT:#FFF2E8;--ink:#12172B;--gray:#5A6178;--soft:#98A0B8;--line:#E3E8F5;
 --bg:#F7F9FF;--card:#fff;--green:#1D7A4C;--amber:#C9942F;--red:#B4472E;--pend:#DFE6F6;
 --serif:'Instrument Serif',Georgia,serif;--ui:Inter,-apple-system,'Segoe UI',sans-serif;
 --sh:0 1px 2px rgba(6,26,82,.05),0 10px 28px rgba(6,26,82,.07)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);
 letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
/* ============ signed out ============ */
#out{min-height:100vh;display:grid;place-items:center;padding:26px;background:#FBF8F4}
.card{width:100%;max-width:412px;background:#fff;border:1px solid var(--line);
 border-radius:18px;padding:36px 34px 30px;box-shadow:0 26px 64px rgba(6,26,82,.11)}
.mk{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.mk b{font:600 18px var(--ui);color:var(--blue)}.mk b i{font-style:normal;color:var(--or)}
h1.lg{font:400 28px/1.2 var(--serif);margin:0 0 6px;color:var(--ink2)}
.lede{margin:0 0 22px;color:var(--gray);font-size:14.5px}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;
 margin-bottom:9px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
 font:600 14.5px var(--ui);cursor:pointer;transition:.15s}
.sso:hover{background:#F7F9FF;border-color:#C9D6F5}
.sso svg{width:18px;height:18px;flex:0 0 18px}
.sso.li{background:#0A66C2;border-color:#0A66C2;color:#fff}.sso.li:hover{background:#095196}
.or{display:flex;align-items:center;gap:11px;margin:18px 0 16px;color:var(--soft);font-size:12px;
 letter-spacing:.05em;text-transform:uppercase}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.fld{margin-bottom:13px}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
label{font:600 12px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--gray)}
.lab a{font:500 12.5px var(--ui);color:var(--blue);cursor:pointer;text-transform:none;letter-spacing:0}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;
 font:400 15px var(--ui);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,65,215,.1)}
.primary{width:100%;margin-top:6px;padding:13px;border:0;border-radius:9px;background:var(--or);
 color:#fff;font:600 15px var(--ui);cursor:pointer}
.primary:hover:not(:disabled){background:var(--orD)}.primary:disabled{opacity:.55}
.alt{width:100%;margin-top:9px;padding:11px;border:1.5px solid var(--line);border-radius:9px;
 background:#fff;color:var(--gray);font:600 14px var(--ui);cursor:pointer}
.alt:hover{background:#F7F9FF;color:var(--blue)}
.foot{margin:20px 0 0;text-align:center;font-size:14px;color:var(--gray)}
.foot a{color:var(--blue);font-weight:600;cursor:pointer}
.micro{margin:16px 0 0;font-size:12px;color:var(--soft);line-height:1.6;text-align:center}
.msg{margin-top:16px;padding:12px 14px;border-radius:9px;font-size:13.5px;display:none}
.msg.ok{display:block;background:#E9F6EF;color:#14683F;border:1px solid #BFE3D0}
.msg.err{display:block;background:#FDECE7;color:#9B3B1E;border:1px solid #F6CDBE}
/* ============ app shell ============ */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink2);color:#9FB0D8;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.sbrand{display:flex;align-items:center;gap:9px;padding:6px 10px 18px}
.sbrand b{font:600 16px var(--ui);color:#fff}.sbrand b i{font-style:normal;color:var(--or)}
.snav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font:500 13.5px var(--ui);
 color:#9FB0D8;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.snav:hover{background:rgba(255,255,255,.07);color:#fff}
.snav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:650}
.snav svg{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.9;
 stroke-linecap:round;stroke-linejoin:round}
.snav .sc{margin-left:auto;font:600 11px var(--ui);color:#7C8AAE}
.snav.on .sc{color:#C3CFF2}
.sdiv{height:1px;background:rgba(255,255,255,.1);margin:11px 6px}
.sfoot{margin-top:auto}
.main{min-width:0;background:var(--bg)}
.top{position:sticky;top:0;z-index:20;background:rgba(247,249,255,.94);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);padding:16px 30px 14px}
.tin{display:flex;align-items:center;gap:14px;max-width:1160px;margin:0 auto}
.tin h1{font:800 25px var(--ui);letter-spacing:-.02em;margin:0}
.tin .sub{margin:2px 0 0;font-size:12.5px;color:var(--gray)}
.chip{margin-left:auto;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
 border-radius:99px;padding:5px 6px 5px 13px;font:600 12.5px var(--ui);color:var(--gray)}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;
 place-items:center;font:700 11px var(--ui)}
.wrap{max-width:1160px;margin:0 auto;padding:26px 30px 70px}
@media(max-width:860px){#app{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;
 padding:10px}.sdiv,.sfoot{display:none}.snav{width:auto;white-space:nowrap}.wrap,.top{padding-inline:16px}}
</style></head><body>
<style>
/* ---- greeting + setup ---- */
.hello{margin-bottom:20px}
.hello h2{font:400 32px/1.15 var(--serif);color:var(--ink2);margin:0 0 4px}
.hello p{margin:0;color:var(--gray);font-size:14px}
.panel.setup{border-color:#FFD9BE;background:linear-gradient(180deg,#FFFCF9,#fff)}
.shead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sbar{flex:1;min-width:140px;height:8px;border-radius:99px;background:#F0E4D8;overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--orD));transition:width .5s}
.spct{font:800 15px var(--ui);color:var(--orD)}
.steps{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--line);
 border-radius:11px;background:#fff;cursor:pointer;transition:.14s}
.step:hover{border-color:var(--or)}
.step.done{opacity:.62;cursor:default}.step.done:hover{border-color:var(--line)}
.sdot{width:22px;height:22px;border-radius:50%;flex:0 0 22px;display:grid;place-items:center;
 border:1.8px solid var(--line);font:700 11px var(--ui);color:#fff}
.step.done .sdot{background:var(--green);border-color:var(--green)}
.step b{display:block;font-size:14px;font-weight:600}
.step span:not(.sdot):not(.rbtn){display:block;font-size:12.5px;color:var(--gray);margin-top:2px}
.step em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:600;color:var(--green)}
.step .rbtn{margin-left:auto}
/* ---- account menu ---- */
.acct{margin-left:auto;position:relative}
.chip{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
 border-radius:99px;padding:5px 10px 5px 13px;font:600 12.5px var(--ui);color:var(--gray);cursor:pointer}
.chip:hover{border-color:#C9D6F5}
.chip .plan{color:var(--ink)}
.chip .bal{color:var(--or);border-left:1px solid var(--line);padding-left:9px}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
 display:grid;place-items:center;font:700 11px var(--ui);overflow:hidden}
.chip .av img{width:100%;height:100%;object-fit:cover}
.chip .cv{width:13px;height:13px;color:var(--soft)}
.amenu{position:absolute;top:calc(100% + 9px);right:0;min-width:236px;background:#fff;
 border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 44px rgba(6,26,82,.18);
 padding:7px;z-index:60;display:none}
.amenu.on{display:block}
.ahead{display:flex;gap:11px;align-items:center;padding:9px 10px 12px;border-bottom:1px solid #F1F4FA;margin-bottom:6px}
.ahead .av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;
 display:grid;place-items:center;font:700 13px var(--ui);flex:0 0 36px;overflow:hidden}
.ahead .av img{width:100%;height:100%;object-fit:cover}
.ahead b{display:block;font-size:13.5px;word-break:break-all}
.ahead em{font-style:normal;font-size:11.5px;color:var(--soft)}
.ami{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 11px;
 border-radius:8px;font:500 13.5px var(--ui);color:var(--ink);cursor:pointer;text-decoration:none}
.ami:hover{background:#F5F8FF;color:var(--blue)}
.ami.danger{color:var(--red)}.ami.danger:hover{background:#FDECE7;color:var(--red)}
.asep{height:1px;background:#F1F4FA;margin:6px 4px}
/* ---- clickable dashboard ---- */
.kpi.click{cursor:pointer;transition:.14s}
.kpi.click:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--sh)}
.panel.click{cursor:pointer}.panel.click:hover{border-color:#C9D6F5}
.pmore{font:600 12px var(--ui);color:var(--blue);margin-top:12px;display:inline-block}
/* ---- document rows ---- */
.drow{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.drow.open{border-color:#C9D6F5;box-shadow:var(--sh)}
.dhead{display:flex;align-items:center;gap:13px;padding:12px 15px;cursor:pointer}
.dhead:hover{background:#FBFCFF}
.dhead .cav{width:15px;height:15px;flex:0 0 15px;color:var(--soft);transition:transform .18s}
.drow.open .cav{transform:rotate(90deg)}
.dsum{margin-left:auto;font-size:12.5px;color:var(--gray);white-space:nowrap}
.dbody{display:none;border-top:1px solid #EEF2FA;padding:12px 15px 15px}
.drow.open .dbody{display:block}
.dfile{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);
 border-radius:9px;margin-bottom:7px;background:#fff;text-decoration:none;color:var(--ink)}
.dfile:hover{border-color:var(--blue);background:#FBFCFF}
.fico{width:30px;height:30px;border-radius:7px;flex:0 0 30px;display:grid;place-items:center;
 font:800 8.5px var(--ui);color:#fff;letter-spacing:.03em}
.fico.pdf{background:#B4472E}.fico.md{background:#0F7B8A}.fico.doc{background:#0041D7}
.dfile b{font-size:13.5px;font-weight:600}
.dfile em{font-style:normal;font-size:11px;color:var(--soft);margin-left:auto}
/* ---- segmented toggle ---- */
.seg{display:inline-flex;background:#EEF1F8;border-radius:10px;padding:3px;margin-bottom:18px}
.sg{border:0;background:none;padding:8px 20px;border-radius:8px;font:600 13.5px var(--ui);
 color:var(--gray);cursor:pointer}
.sg.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(6,26,82,.12)}
/* ---- profile form ---- */
.pform{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pform .full{grid-column:1/-1}
.pf label{display:block;margin-bottom:5px}
.pf input,.pf select,.pf textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);
 border-radius:9px;font:400 14px var(--ui);outline:none;background:#fff}
.pf input:focus,.pf select:focus,.pf textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,65,215,.1)}
.avrow{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.avbig{width:66px;height:66px;border-radius:50%;background:var(--blue);color:#fff;display:grid;
 place-items:center;font:700 22px var(--ui);flex:0 0 66px;overflow:hidden}
.avbig img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--gray);line-height:1.6}
.chk input{width:auto;margin-top:3px;flex:0 0 auto}
@media(max-width:860px){.pform{grid-template-columns:1fr}.chip .bal,.chip .plan{display:none}}
/* ============ dashboard ============ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px;box-shadow:var(--sh)}
.kpi .n{font:800 34px var(--ui);color:var(--ink2);letter-spacing:-.02em;line-height:1}
.kpi .l{font:500 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--gray);margin-top:8px}
.kpi.accent .n{color:var(--or)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;
 box-shadow:var(--sh);margin-bottom:18px}
.panel h3{margin:0 0 4px;font:600 13px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.bar{position:relative;height:13px;border-radius:99px;background:#EEF1F8;margin:14px 0 8px;overflow:hidden}
.bar .pot{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#E7EDFB,#E7EDFB 7px,#F2F5FC 7px,#F2F5FC 14px)}
.bar .cur{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--or),var(--orD));transition:width .5s}
.note{font-size:12px;color:var(--soft);margin:6px 0 0}
/* ============ pipeline ============ */
.ctrl{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ctrl .t{font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--gray)}
.pill{margin-left:auto;display:flex;gap:6px}
.pill button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;
 font:600 12.5px var(--ui);color:var(--gray);cursor:pointer}
.pill button.on{background:var(--tint);border-color:#C9D6F5;color:var(--blue)}
.opp{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;
 box-shadow:0 1px 2px rgba(6,26,82,.04);overflow:hidden;transition:box-shadow .15s}
.opp.open{box-shadow:var(--sh);border-color:#C9D6F5}
.ohead{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;user-select:none}
.ohead:hover{background:#FBFCFF}
.cav{width:15px;height:15px;flex:0 0 15px;color:var(--soft);transition:transform .18s}
.opp.open .cav{transform:rotate(90deg)}
.olg{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:grid;place-items:center;
 color:#fff;font:700 13px var(--ui)}
.otitle{flex:1;min-width:0}
.otitle b{display:block;font:600 15px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otitle span{display:block;font-size:12.5px;color:var(--gray);margin-top:1px}
.src{width:22px;height:22px;border-radius:5px;flex:0 0 22px;display:grid;place-items:center;
 background:#F2F5FC;text-decoration:none}
.src svg{width:13px;height:13px}
.rank{flex:0 0 auto;text-align:center;background:var(--tint);border:1px solid #D8E2FB;border-radius:9px;padding:5px 9px}
.rank .rs{font:800 15px var(--ui);color:var(--blue);line-height:1}
.rank .rl{font:600 8.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:2px}
.ph{font:700 10px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;
 border-radius:99px;white-space:nowrap}
.ph.assess{background:#EFEFF6;color:#5A6178}.ph.prepare{background:#EEF3FF;color:var(--blue)}
.ph.reach{background:var(--orT);color:var(--orD)}.ph.convert{background:#E4F0E9;color:var(--green)}
.ph.passed{background:#F1F1F4;color:var(--soft)}
.mini{width:92px;height:6px;border-radius:99px;background:#EEF1F8;overflow:hidden;flex:0 0 92px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--or))}
.obody{border-top:1px solid #EEF2FA;padding:18px 18px 20px;display:none}
.opp.open .obody{display:block}
/* phase rail */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.rseg{background:#F7F9FF;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.rseg.done{background:var(--tint);border-color:#C9D6F5}
.rseg.now{background:var(--orT);border-color:#FFD9BE}
.rseg .rn{font:700 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.rseg.done .rn{color:var(--blue)}.rseg.now .rn{color:var(--orD)}
.rseg .rv{font:600 13px var(--ui);color:var(--ink);margin-top:4px}
.rseg .rd{font-size:11.5px;color:var(--soft);margin-top:2px}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;font:600 13px var(--ui);color:var(--gray);cursor:pointer;
 border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab .tc{margin-left:6px;font-size:11px;color:var(--soft)}
.pane{font-size:14px;line-height:1.7;color:#333A4D}
.empty{color:var(--soft);font-size:13.5px;padding:8px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;
 padding:11px 13px;background:#fff}
.tile.miss{opacity:.5;border-style:dashed}
.tico{width:30px;height:30px;border-radius:7px;background:var(--tint);flex:0 0 30px;display:grid;place-items:center}
.tico svg{width:14px;height:14px;fill:var(--blue)}
.tname{flex:1;min-width:0}
.tname b{display:block;font-size:13.5px}
.tname em{font-style:normal;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.rbtn{font:700 11.5px var(--ui);border:1px solid var(--line);border-radius:7px;padding:6px 11px;
 color:var(--ink);background:#fff;cursor:pointer}
.rbtn:hover{border-color:var(--blue);color:var(--blue)}
.aev{padding:10px 0;border-bottom:1px solid #F2F5FB}
.ah{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ad{font:600 11.5px var(--ui);color:var(--soft)}
.at{font:700 9.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--blue);
 background:var(--tint);padding:3px 8px;border-radius:99px}
.aw{font:600 12px var(--ui);color:var(--gray)}
.as{font-size:13px;color:var(--gray);margin-top:3px}
.soon{background:var(--orT);border:1px solid #FFD9BE;border-radius:11px;padding:14px 16px;
 font-size:13px;line-height:1.6;color:#7A4A22}
.soon b{color:#5C3616}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.rail{grid-template-columns:repeat(2,1fr)}
 .tiles{grid-template-columns:1fr}.mini,.src{display:none}}
</style>

 <div class="card">

const D={opps:[],stages:{},contacts:[],recruiters:[],acts:{},files:{},profile:null,email:"",provider:"",filesReady:false};
async function load(){
 const [o,s,c,r,a]=await Promise.all([
  sb.from("opportunities").select("*").order("rank_score",{ascending:false}),
  sb.from("stages").select("*"),
  sb.from("contacts").select("*").order("full_name"),
  sb.from("recruiters").select("*").order("fit_score",{ascending:false}),
  sb.from("activities").select("*").order("happened_on",{ascending:false})]);
 D.opps=o.data||[]; D.contacts=c.data||[]; D.recruiters=r.data||[];
 const pr=await sb.from("profiles").select("*").maybeSingle();
 D.profile=pr.data||{};
 if(D.profile.avatar_path){
   const {data:pub}=sb.storage.from("avatars").getPublicUrl(D.profile.avatar_path);
   D.profile.avatar_url=pub&&pub.publicUrl;}
 const dc=await sb.from("documents").select("*");
 D.files={}; (dc.data||[]).forEach(f=>{
   const k=f.kind==="cover_letter"?"cover":(f.kind==="analysis"?"analysis":f.kind);
   (D.files[f.opportunity_id]=D.files[f.opportunity_id]||[]).push({
     kind:k,title:f.title,bytes:f.bytes||0,file:f.storage_path||"",url:"#"});});
 D.filesReady=(dc.data||[]).length>0;
 const m=new Date(); m.setDate(1); m.setHours(0,0,0,0);
 const ul=await sb.from("usage_ledger").select("quantity")
   .eq("item","networking_pass").gte("occurred_at",m.toISOString());
 D.passesUsed=(ul.data||[]).reduce((n,x)=>n+(x.quantity||1),0);
 D.stages={}; (s.data||[]).forEach(x=>{(D.stages[x.opportunity_id]=D.stages[x.opportunity_id]||[]).push(x);});
 D.acts={};   (a.data||[]).forEach(x=>{(D.acts[x.opportunity_id]=D.acts[x.opportunity_id]||[]).push(x);});
}
const done=(id,st)=>(D.stages[id]||[]).some(x=>x.stage===st);
const stageDate=(id,st)=>((D.stages[id]||[]).find(x=>x.stage===st)||{}).completed_on;
function phaseOf(o){
 if(o.status==="passed")return{k:"passed",n:"Passed",i:-1};
 let i=0;
 PHASE.forEach((p,x)=>{ if(p.stages.some(s=>done(o.id,s))) i=x; });
 const cur=PHASE[i];
 const nextInPhase=cur.stages.some(s=>!done(o.id,s));
 const j=nextInPhase?i:Math.min(i+1,3);
 return{k:PHASE[j].k,n:PHASE[j].n,i:j};}
function pct(o){const t=PHASE.reduce((n,p)=>n+p.stages.length,0);
 const d=PHASE.reduce((n,p)=>n+p.stages.filter(s=>done(o.id,s)).length,0);
 return Math.round(d/t*100);}
const initials=s=>String(s||"?").replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean)
 .slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const COL=["#0041D7","#1D7A4C","#6A46A6","#B4472E","#0F7B8A","#C9942F"];
const colOf=s=>COL[[...String(s||"")].reduce((n,c)=>n+c.charCodeAt(0),0)%COL.length];
const fdate=d=>d?new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";

function vDash(){
 const live=D.opps.filter(o=>o.status!=="passed");
 const k=[["Opportunities",D.opps.length,0,"pipe"],["Live",live.length,0,"pipe"],
  ["Warm contacts",D.contacts.length,1,"net"],["Recruiters",D.recruiters.length,0,"recs"]];
 const now=Math.round(live.reduce((n,o)=>n+(+o.landing_base||0),0)/Math.max(live.length,1));
 const pot=Math.min(99,now+33);
 const recent=Object.values(D.acts).flat()
  .sort((a,b)=>(b.happened_on||"").localeCompare(a.happened_on||"")).slice(0,6);
 const st=setupSteps(), dn=st.filter(x=>x.done).length;
 const pctSetup=Math.round(dn/st.length*100);
 const setup=pctSetup===100?"":`<div class="panel setup">
   <div class="shead"><div><h3 style="color:var(--or)">Getting set up</h3>
     <div style="font:400 24px/1.2 var(--serif);color:var(--ink2);margin-top:4px">${dn} of ${st.length} done</div></div>
    <div class="sbar"><i style="width:${pctSetup}%"></i></div><b class="spct">${pctSetup}%</b></div>
   <div class="steps">${st.map(x=>`<div class="step${x.done?" done":""}"${x.go&&!x.done?` data-go="${x.go}"`:""}>
     <span class="sdot">${x.done?"&#10003;":""}</span>
     <div><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div>
     ${x.done?'<em>Done</em>':'<span class="rbtn">Start</span>'}</div>`).join("")}</div></div>`;
 return `<div class="hello"><h2>${greet()}, ${esc((D.profile.full_name||D.email).split(" ")[0].split("@")[0])}</h2>
   <p>${D.opps.length?`${live.length} live opportunities &middot; ${D.contacts.length} people in your network`:"Nothing in the pipeline yet."}</p></div>
  ${setup}
  <div class="kpis">${k.map(x=>`<div class="kpi click${x[2]?" accent":""}" data-go="${x[3]}">
   <div class="n">${x[1]}</div><div class="l">${x[0]}</div></div>`).join("")}</div>
  <div class="panel click" data-go="pipe"><h3>Landing likelihood &mdash; portfolio</h3>
   <div class="bar"><span class="pot" style="width:${pot}%"></span>
    <span class="cur" style="width:${now}%"></span></div>
   <p class="note">${now}% now &middot; ${pot}% with the networking passes finished</p>
   <span class="pmore">Open the pipeline &rarr;</span></div>
  <div class="panel click" data-go="docs"><h3>Recent activity</h3>
   ${recent.length?recent.map(a=>`<div class="aev"><div class="ah">
     <span class="ad">${fdate(a.happened_on)}</span>
     <span class="at">${esc(a.kind||"note")}</span>
     ${a.who?`<span class="aw">${esc(a.who)}</span>`:""}</div>
     ${a.summary?`<div class="as">${esc(a.summary)}</div>`:""}</div>`).join("")
    :'<p class="empty">Nothing logged yet.</p>'}
   <span class="pmore">Go to documents &rarr;</span></div>`;}

function railOf(o){
 const cur=phaseOf(o);
 return `<div class="rail">${PHASE.map((p,i)=>{
  const dn=p.stages.filter(s=>done(o.id,s));
  const cls=dn.length===p.stages.length?"done":(cur.i===i?"now":"");
  const last=dn.map(s=>stageDate(o.id,s)).filter(Boolean).sort().pop();
  return `<div class="rseg ${cls}"><div class="rn">${p.n}</div>
   <div class="rv">${dn.length} of ${p.stages.length}</div>
   <div class="rd">${last?fdate(last):p.stages.map(s=>STAGEN[s]).join(" · ")}</div></div>`;
 }).join("")}</div>`;}

  const bits=[["Fit score",o.rank_score!=null?o.rank_score+" / 100":null],
   ["Salary target",o.salary_target?"$"+Number(o.salary_target).toLocaleString():null],
   ["Location",o.location],["Requisition",o.req],["How to apply",o.method],
   ["Landing likelihood",o.landing_base!=null?o.landing_base+"%":null]]
   .filter(b=>b[1]).map(b=>`<div class="aev"><div class="ah"><span class="ad">${b[0]}</span></div>
    <div class="as" style="color:var(--ink);font-weight:500">${esc(b[1])}</div></div>`).join("");
  return bits + (o.excluded?`<div class="soon" style="margin-top:14px"><b>Deliberately not contacted.</b><br>${esc(o.excluded)}</div>`:"");}
 if(t==="docs"){

   ["cover","Cover letter","In your voice",done(o.id,"cover_letter")],

   ["thanks","Thank-you letter","After the interview",false]];
  return `<div class="tiles">${T.map(d=>`<div class="tile${d[3]?"":" miss"}">
    <span class="tico"><svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z" opacity=".25"/><path d="M14 2v4h4"/><path d="M8 13h8v1.6H8zm0 3.4h6V18H8z"/></svg></span>
    <span class="tname"><b>${d[1]}</b><em>${d[2]}</em></span>
    <span class="rbtn">${d[3]?"Open":"Build"}</span></div>`).join("")}</div>
   <p class="empty" style="margin-top:12px">Files live on your desktop until document storage is wired up.</p>`;}
 if(t==="net"){
  const cs=D.contacts.filter(c=>(c.company||"")===o.company);
  return cs.length?`<div class="tiles">${cs.map(c=>`<div class="tile">
    <span class="tico" style="background:#EEF3FF"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-4.2 3.4-6.2 7.5-6.2s7.5 2 7.5 6.2z"/></svg></span>
    <span class="tname"><b>${esc(c.full_name)}</b><em>${esc(c.title||"")}</em></span>
    ${c.linkedin_url?`<a class="rbtn" href="${esc(c.linkedin_url)}" target="_blank" rel="noopener">Profile</a>`:""}
    </div>`).join("")}</div>`
   :'<p class="empty">No contacts researched for this one yet.</p>';}
 if(t==="comms")
  return acts.length?acts.map(a=>`<div class="aev"><div class="ah">
    <span class="ad">${fdate(a.happened_on)}</span><span class="at">${esc(a.kind||"note")}</span>
    ${a.who?`<span class="aw">${esc(a.who)}</span>`:""}</div>
    ${a.summary?`<div class="as">${esc(a.summary)}</div>`:""}</div>`).join("")
   :'<p class="empty">Nothing logged yet.</p>';
 if(t==="ints")
  return `<div class="soon"><b>Interviews are the next build.</b> Initial, follow-up and final
   as their own records &mdash; who you are meeting, the questions the posting implies, your
   matching stories, and a thank-you drafted within an hour of finishing.</div>`;
 return `<div class="soon"><b>Salary negotiation is coming after interviews.</b> Your target and
  floor already exist in the fit analysis. This adds their number, the gap, a counter written
  in your voice, and a log of who said what.</div>`;}

function vPipe(){
 const live=D.opps.filter(o=>o.status!=="passed"), pass=D.opps.filter(o=>o.status==="passed");
 const rows=os=>os.map(o=>{const ph=phaseOf(o),p=pct(o);
  return `<div class="opp" data-id="${o.id}">
   <div class="ohead">
    <svg class="cav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    <span class="olg" style="background:${colOf(o.company)}">${initials(o.company)}</span>
    ${srcIcon(o)}
    <span class="otitle"><b>${esc(o.role)}</b><span>${esc(o.company)}${o.location?" · "+esc(o.location):""}</span></span>
    <span class="mini"><i style="width:${p}%"></i></span>
    ${o.rank_score!=null?`<span class="rank"><span class="rs">${o.rank_score}</span><span class="rl">Rank</span></span>`:""}
    <span class="ph ${ph.k}">${ph.n}</span>
   </div>
   <div class="obody">
    ${railOf(o)}
    <div class="tabs">${TABS.map((t,i)=>`<button class="tab${i?"":" on"}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
    <div class="pane" data-pane>${paneOf(o,"ov")}</div>
   </div></div>`;}).join("");
 return `<div class="ctrl"><span class="t">Live &mdash; ${live.length}</span></div>${rows(live)}
  ${pass.length?`<div class="ctrl" style="margin-top:26px"><span class="t">Passed &mdash; ${pass.length}</span></div>
   <div style="opacity:.62">${rows(pass)}</div>`:""}`;}

function vList(kind){
 if(kind==="net"){
  return D.contacts.length?`<div class="tiles">${D.contacts.map(c=>`<div class="tile">
    <span class="tico" style="background:#EEF3FF"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-4.2 3.4-6.2 7.5-6.2s7.5 2 7.5 6.2z"/></svg></span>
    <span class="tname"><b>${esc(c.full_name)}</b><em>${esc([c.title,c.company].filter(Boolean).join(" · "))}</em></span>
    ${c.linkedin_url?`<a class="rbtn" href="${esc(c.linkedin_url)}" target="_blank" rel="noopener">Profile</a>`:""}
   </div>`).join("")}</div>`:'<p class="empty">No contacts yet.</p>';}
 if(kind==="recs"){
  return D.recruiters.length?`<div class="tiles">${D.recruiters.map(r=>`<div class="tile">
    <span class="tico" style="background:#F3EEFA"><svg viewBox="0 0 24 24" fill="#6A46A6"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-4.2 3.4-6.2 7.5-6.2s7.5 2 7.5 6.2z"/></svg></span>
    <span class="tname"><b>${esc(r.firm)}</b><em>${esc(r.focus||"")}</em></span>
    ${r.fit_score?`<span class="rank"><span class="rs">${r.fit_score}</span><span class="rl">Fit</span></span>`:""}
    ${r.linkedin_url?`<a class="rbtn" href="${esc(r.linkedin_url)}" target="_blank" rel="noopener">Open</a>`:""}
   </div>`).join("")}</div>`:'<p class="empty">No recruiters yet.</p>';}
 if(kind==="docs") return vDocs();
 if(kind==="acct") return vAcctShell();
 if(kind==="cal"){
  return `<div class="soon"><b>Calendar is not built yet.</b> It will carry interviews,
   follow-up dates and application deadlines, pulled from the opportunities rather than typed twice.</div>`;}
 if(kind==="ints"){
  return `<div class="soon"><b>Interviews across every job.</b> This is the next build &mdash;
   initial, follow-up and final as records, each with who you are meeting, likely questions from the
   posting, your matching stories, and the thank-you letter.</div>`;}
 return `<div class="soon"><b>Negotiation across every live offer.</b> Target and floor from the
  fit analysis, their number when it lands, the gap, and a counter in your voice.</div>`;}

function fld(id,lab,v,t){return `<div class="pf"><label for="${id}">${lab}</label>
 <input id="${id}" type="${t||"text"}" value="${esc(v==null?"":v)}"></div>`;}

let acctTab="profile";
const PLANS={
 free:      {n:"Free",       price:"$0",   passes:0,
   inc:["5 roles scored a month","Read in full, not keyword-matched","A verdict and a reason on each","A free evaluation of where you stand","A strategy recommendation"]},
 scout:     {n:"Scout",      price:"$9",   passes:0,
   inc:["Everything in Free","Import your saved jobs from LinkedIn","Import a search, a link or a CSV","Unlimited scoring","Pipeline kept warm while you watch"]},
 search:    {n:"Search",     price:"$39",  passes:5,
   inc:["Everything in Scout","5 résumés and 5 cover letters a month","5 networking passes a month","Voiceprint interview included","ATS gate on every document"]},
 campaign:  {n:"Campaign",   price:"$89",  passes:25,
   inc:["Everything in Search","15 résumés and 15 cover letters a month","25 networking passes a month","Every person verified, outreach drafted","Recruiter shortlist in your city"]},
 executive: {n:"Executive",  price:"$249", passes:-1,
   inc:["Everything in Campaign","Unlimited roles and documents","Unlimited networking passes","Board and executive path mapping","A human reads your first three packages"]}};

function vAccount(){
 const key=(D.profile&&D.profile.plan)||"free", pl=PLANS[key]||PLANS.free;
 const used=D.passesUsed||0;
 const cap=pl.passes, left=cap<0?"Unlimited":Math.max(0,cap-used);
 const pctBar=cap>0?Math.min(100,Math.round(used/cap*100)):0;
 const others=Object.keys(PLANS).filter(k=>k!==key);
 return `<div class="panel">
  <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap">
   <div><h3 style="margin-bottom:8px">Your plan</h3>
    <div style="font:400 34px/1 var(--serif);color:var(--ink2)">${pl.n}</div>
    <div style="font-size:13px;color:var(--gray);margin-top:5px">${pl.price}${key==="free"?"":" a month"} &middot; cancel any time</div></div>
   ${key==="executive"?"":`<a class="primary" href="/pricing/" target="_blank" rel="noopener"
     style="margin-left:auto;max-width:190px;text-align:center;text-decoration:none;display:block">Upgrade plan</a>`}
  </div>
  <div style="margin-top:20px;padding-top:18px;border-top:1px solid #F1F4FA">
   <h3>Networking passes</h3>
   <div class="bar" style="margin-top:12px"><span class="cur" style="width:${pctBar}%"></span></div>
   <p class="note">${cap<0?"Unlimited this month":`${used} of ${cap} used &middot; <b style="color:var(--or)">${left} left</b> this month`}${cap===0?" &mdash; networking passes start on the Search plan":""}</p>
  </div>
 </div>

 <div class="panel"><h3>What ${pl.n} includes</h3>
  <div style="margin-top:12px">${pl.inc.map(i=>`<div class="aev" style="border:0;padding:7px 0">
   <div class="ah"><span class="at" style="background:#E4F0E9;color:var(--green)">&#10003;</span>
   <span style="font-size:14px;color:var(--ink)">${esc(i)}</span></div></div>`).join("")}</div></div>

 <div class="panel"><h3>Other plans</h3>
  <div class="tiles" style="margin-top:12px">${others.map(k=>{const o=PLANS[k];
   return `<div class="tile"><span class="tname"><b>${o.n} &middot; ${o.price}</b>
    <em>${o.passes<0?"Unlimited passes":o.passes?o.passes+" passes a month":"No networking passes"}</em></span>
    <a class="rbtn" href="/pricing/" target="_blank" rel="noopener">See</a></div>`;}).join("")}</div></div>

 <div class="panel"><h3>Billing</h3>
  <p class="empty" style="padding:10px 0">No billing activity. Nothing has been charged to this
  account and no card is on file.</p></div>

 <div class="panel"><h3>Account</h3>
  <div class="aev"><div class="ah"><span class="ad">Email</span></div><div class="as" style="color:var(--ink)">${esc(D.email)}</div></div>
  <div class="aev"><div class="ah"><span class="ad">Signed in with</span></div><div class="as" style="color:var(--ink)">${esc(D.provider||"email")}</div></div>
  <div class="aev" style="border:0"><div class="ah"><span class="ad">Member since</span></div>
   <div class="as" style="color:var(--ink)">${D.profile&&D.profile.created_at?fdate(String(D.profile.created_at).slice(0,10)):"today"}</div></div></div>`;}

function vAcctShell(){
 return `<div class="seg"><button class="sg${acctTab==="profile"?" on":""}" data-at="profile">Profile</button>
  <button class="sg${acctTab==="account"?" on":""}" data-at="account">Account</button></div>
  <div id="acctBody">${acctTab==="profile"?vProfileForm():vAccount()}</div>`;}

function vProfileForm(){
 const p=D.profile||{};
 const av=p.avatar_url
  ?`<img src="${esc(p.avatar_url)}" alt="">`
  :esc(initials(p.full_name||D.email));
 return `<div class="panel">
  <div class="avrow">
   <span class="avbig" id="avBig">${av}</span>
   <div><b style="display:block;font-size:15px">${esc(p.full_name||D.email)}</b>
    <span style="font-size:12.5px;color:var(--soft)">${esc(p.headline||"No headline yet")}</span>
    <div style="margin-top:9px;display:flex;gap:8px">
     <button class="rbtn" id="avPick">Change picture</button>
     <button class="rbtn" id="fromResume">Fill from my r&eacute;sum&eacute;</button></div></div>
   <input id="avFile" type="file" accept="image/*" class="hide">
  </div>
  <div class="pform">
   ${fld("p_name","Full name",p.full_name)}
   ${fld("p_head","Headline",p.headline)}
   ${fld("p_email","Email",D.email,"email")}
   ${fld("p_phone","Phone",p.phone,"tel")}
   ${fld("p_a1","Address",p.address_line1)}
   ${fld("p_a2","Address line 2",p.address_line2)}
   ${fld("p_city","City",p.city)}
   ${fld("p_state","State",p.state)}
   ${fld("p_zip","Postcode",p.postal_code)}
   ${fld("p_ctry","Country",p.country)}
   ${fld("p_li","LinkedIn URL",p.linkedin_url,"url")}
   ${fld("p_web","Website",p.website_url,"url")}
   ${fld("p_yrs","Years of experience",p.years_experience,"number")}
   ${fld("p_notice","Notice period",p.notice_period)}
   ${fld("p_floor","Salary floor",p.salary_floor,"number")}
   ${fld("p_target","Salary target",p.salary_target,"number")}
   <div class="pf"><label for="p_remote">Work preference</label>
    <select id="p_remote">${["any","remote","hybrid","onsite"].map(o=>
      `<option value="${o}"${p.remote_pref===o?" selected":""}>${o[0].toUpperCase()+o.slice(1)}</option>`).join("")}</select></div>
   <div class="pf"><label for="p_auth">Work authorisation</label>
    <input id="p_auth" value="${esc(p.work_auth||"")}"></div>
   <div class="full pf"><label for="p_open">Open to</label>
    <input id="p_open" value="${esc(p.open_to||"")}" placeholder="Director of Marketing, VP Demand Gen…"></div>
   <div class="full"><label class="chk"><input type="checkbox" id="p_priv"${p.privacy_ack_at?" checked":""}>
    <span>I understand this information is stored in my own account, is never shown to another user
    or sold, and I can export or delete it at any time &mdash; as set out in the
    <a href="/privacy/" target="_blank" style="color:var(--blue)">privacy policy</a>.</span></label></div>
   <div class="full"><button class="primary" id="pSave" style="max-width:200px">Save profile</button>
    <span id="pMsg" style="margin-left:12px;font-size:13px;color:var(--green)"></span></div>
  </div></div>

  <div class="panel"><h3>Plan and allowances</h3>
   <div class="aev"><div class="ah"><span class="ad">Plan</span></div>
    <div class="as" style="color:var(--ink);font-weight:600">Free &mdash; you are user one</div></div>
   <div class="aev"><div class="ah"><span class="ad">Networking passes this month</span></div>
    <div class="as">0 used &middot; Search includes 5, Campaign 25, Executive unlimited</div></div>
   <div class="aev"><div class="ah"><span class="ad">Signed in with</span></div>
    <div class="as">${esc(D.provider||"email")}</div></div></div>`;}

function vDocs(){
 const rows=D.opps.map(o=>{
   const fs=(D.files[o.id]||[]);
   const built=[done(o.id,"analyzed")&&"analysis",done(o.id,"resume")&&"resume",
                done(o.id,"cover_letter")&&"cover"].filter(Boolean);
   if(!fs.length && !built.length) return "";
   const parts=[];
   const c=k=>fs.filter(f=>f.kind===k).length || (built.includes(k)?1:0);
   if(c("resume"))   parts.push(c("resume")+" r\u00e9sum\u00e9"+(c("resume")>1?"s":""));
   if(c("cover"))    parts.push(c("cover")+" cover letter"+(c("cover")>1?"s":""));
   if(c("analysis")) parts.push(c("analysis")+" analysis");
   return `<div class="drow" data-id="${o.id}">
    <div class="dhead">
     <svg class="cav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
     <span class="olg" style="background:${colOf(o.company)}">${initials(o.company)}</span>
     <span class="otitle"><b>${esc(o.company)}</b><span>${esc(o.role)}</span></span>
     <span class="dsum">${parts.join(" &middot; ")||"nothing built"}</span></div>
    <div class="dbody">${fs.length?fs.map(f=>{
       const ext=(f.file.split(".").pop()||"").toLowerCase();
       const cls=ext==="pdf"?"pdf":(ext==="md"?"md":"doc");
       return `<a class="dfile" href="${esc(f.url)}" target="_blank" rel="noopener">
        <span class="fico ${cls}">${ext.toUpperCase()}</span>
        <b>${esc(f.title)}</b><em>${Math.round(f.bytes/1024)} KB</em></a>`;}).join("")
      :`<p class="empty">Built, but the file is not uploaded yet.</p>`}</div></div>`;
  }).filter(Boolean).join("");
 return (rows||'<p class="empty">Nothing built yet.</p>') +
  (D.filesReady?"":`<div class="soon" style="margin-top:16px"><b>Your 52 documents are extracted and
   sitting on your desktop</b> in Foot Jar Business &rsaquo; documents. Uploading them into your
   account is the next step &mdash; after that they open straight from here.</div>`);}

function draw(){
 const t=TITLES[view]||["",()=>""];
 $("secT").textContent=t[0]; $("secS").textContent=t[1]();
 $("view").innerHTML = view==="dash"?vDash() : view==="pipe"?vPipe() : vList(view);
 if(view==="pipe")wirePipe();
 else if(view==="dash")wireDash();
 else if(view==="docs")wireDocs();
 else if(view==="acct")wireAcct();}

function wirePipe(){
 $("view").querySelectorAll(".ohead").forEach(h=>{
  h.onclick=()=>h.parentElement.classList.toggle("open");});
 $("view").querySelectorAll(".opp").forEach(card=>{
  const o=D.opps.find(x=>x.id===card.dataset.id);
  card.querySelectorAll(".tab").forEach(b=>{
   b.onclick=e=>{e.stopPropagation();
    card.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
    card.querySelector("[data-pane]").innerHTML=paneOf(o,b.dataset.t);};});});}

/* ---------- interactions ---------- */
document.addEventListener("click",e=>{
 if(!e.target.closest(".acct")) $("amenu")&&$("amenu").classList.remove("on");});
function wireShell(){
 $("chip").onclick=e=>{e.stopPropagation();$("amenu").classList.toggle("on");};
 $("amenu").onclick=e=>{const b=e.target.closest("[data-go]");
  if(b){view=b.dataset.go;$("amenu").classList.remove("on");drawNav();draw();}};
 $("signout2").onclick=async()=>{await sb.auth.signOut();location.replace("/app/");};
 $("brandHome").onclick=()=>{view="dash";drawNav();draw();};}

function wireDash(){
 $("view").querySelectorAll("[data-go]").forEach(el=>{
  el.onclick=()=>{view=el.dataset.go;drawNav();draw();};});}

function wireDocs(){
 $("view").querySelectorAll(".dhead").forEach(h=>{
  h.onclick=()=>h.parentElement.classList.toggle("open");});}

function wireAcct(){
 const seg=$("view").querySelector(".seg");
 if(seg) seg.onclick=e=>{const b=e.target.closest("[data-at]"); if(!b)return;
  acctTab=b.dataset.at;
  seg.querySelectorAll(".sg").forEach(x=>x.classList.toggle("on",x===b));
  $("acctBody").innerHTML = acctTab==="profile"?vProfileForm():vAccount();
  if(acctTab==="profile") wireProfile();};
 if(acctTab==="profile") wireProfile();}

async function wireProfile(){
 if(!$("pSave")) return;
 const g=i=>{const e=$(i);return e?(e.value.trim()||null):null;};
 $("avPick").onclick=()=>$("avFile").click();
 $("avFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  const {data:{user}}=await sb.auth.getUser();
  const path=user.id+"/avatar_"+Date.now()+"."+(f.name.split(".").pop()||"png");
  const up=await sb.storage.from("avatars").upload(path,f,{upsert:true});
  if(up.error){$("pMsg").style.color="var(--red)";$("pMsg").textContent=up.error.message;return;}
  await sb.from("profiles").update({avatar_path:path}).eq("id",user.id);
  await load(); draw(); if(view==="acct") wireProfile();};
 $("fromResume").onclick=()=>{
  $("pMsg").style.color="var(--gray)";
  $("pMsg").textContent="Résumé parsing arrives with document upload — next build.";};
 $("pSave").onclick=async()=>{
  const {data:{user}}=await sb.auth.getUser();
  const row={full_name:g("p_name"),headline:g("p_head"),phone:g("p_phone"),
   address_line1:g("p_a1"),address_line2:g("p_a2"),city:g("p_city"),state:g("p_state"),
   postal_code:g("p_zip"),country:g("p_ctry"),linkedin_url:g("p_li"),website_url:g("p_web"),
   years_experience:g("p_yrs")?+g("p_yrs"):null,notice_period:g("p_notice"),
   salary_floor:g("p_floor")?+g("p_floor"):null,salary_target:g("p_target")?+g("p_target"):null,
   remote_pref:$("p_remote").value,work_auth:g("p_auth"),open_to:g("p_open"),
   profile_source:"manual",
   privacy_ack_at:$("p_priv").checked?new Date().toISOString():null};
  const {error}=await sb.from("profiles").update(row).eq("id",user.id);
  $("pMsg").style.color=error?"var(--red)":"var(--green)";
  $("pMsg").textContent=error?error.message:"Saved.";
  if(!error){await load(); $("planN2").textContent=(D.profile.plan||"free")+" plan";}};}

/* ---------- session ---------- */
async function start(s){
 const em=s.user.email||"signed in";
 D.email=em; D.provider=(s.user.app_metadata&&s.user.app_metadata.provider)||"email";
 $("who").textContent=em;
 $("out").classList.add("hide"); $("app").classList.remove("hide");
 await load();
 const ini=initials(D.profile.full_name||em);
 const pic=D.profile.avatar_url?`<img src="${D.profile.avatar_url}" alt="">`:ini;
 $("av").innerHTML=pic; $("av2").innerHTML=pic;
 $("planN").textContent=(D.profile.plan||"free").replace(/^./,c=>c.toUpperCase());
 $("planN2").textContent=(D.profile.plan||"free")+" plan";
 $("balN").textContent="5 passes";
 wireShell(); drawNav(); draw();}
const {data:{session}}=await sb.auth.getSession();
if(session) start(session);
sb.auth.onAuthStateChange((_e,s)=>{ if(s&&$("app").classList.contains("hide")) start(s); });
</script></body></html>
